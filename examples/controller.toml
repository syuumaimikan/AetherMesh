# AetherMesh controller configuration.
# Every key is optional; anything omitted keeps its default.
# CLI flags override this file.

# Address to listen on.
listen = "0.0.0.0:7000"

# Seconds without a heartbeat before a node is evicted.
heartbeat_timeout_secs = 30

# Shared secret every agent must present. Remove to accept any agent.
# Only meaningful together with TLS: without it the token is sent in the clear.
auth_token = "change-me"

# TLS. Both keys are required together; remove both to serve plaintext.
# Generate a self-signed pair with:
#   aether-controller generate-cert --host mesh.example.com
tls_cert_path = "cert.pem"
tls_key_path = "key.pem"

# Seconds between metrics log lines. 0 turns them off.
metrics_interval_secs = 60

# Address the client API listens on (publish data, submit tasks).
# Remove to run without one.
client_listen = "0.0.0.0:7100"

# Serve /metrics (Prometheus) and /healthz here. Unset serves neither.
# No authentication, so bind it to localhost or a management interface.
metrics_listen = "127.0.0.1:9100"

# Seconds between link measurements. 0 leaves the scheduler on whatever
# latency and bandwidth were configured by hand.
probe_interval_secs = 60

# Cache results of identical work: same kind, same payload, same inputs,
# same module. 0 entries turns it off. Failures are never cached.
result_cache_entries = 1024
result_cache_ttl_secs = 300

# How long a queued task waits before it counts as one level more urgent.
# 0 turns promotion off, which makes a low priority a genuine risk of never
# running at all. Set it only if you mean that.
queue_aging_secs = 30

# Most tasks allowed to wait at once. 0 means no cap, which is the default:
# a mesh that silently starts refusing work is worse than one that visibly
# falls behind, so this is your decision rather than ours.
max_queue_size = 0

# What gives way when the queue is full.
#   reject               - turn the newest away; the caller can retry or shed
#   drop_oldest          - newest wins; for a live feed where stale is worthless
#   drop_lowest_priority - keep the queue full of work that matters
queue_rejection = "reject"

# Seconds a task waits for a node before giving up. 0 means never. A caller
# can override this per submission with `timeout_ms`.
queue_timeout_secs = 0
