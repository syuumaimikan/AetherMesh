# AetherMesh controller configuration.
# Every key is optional; anything omitted keeps its default.
# CLI flags override this file.

# Address to listen on.
listen = "0.0.0.0:7000"

# Seconds without a heartbeat before a node is evicted.
heartbeat_timeout_secs = 30

# Shared secret every agent must present. Remove to accept any agent.
# Only meaningful together with TLS: without it the token is sent in the clear.
auth_token = "change-me"

# TLS. Both keys are required together; remove both to serve plaintext.
# Generate a self-signed pair with:
#   aether-controller generate-cert --host mesh.example.com
tls_cert_path = "cert.pem"
tls_key_path = "key.pem"

# Seconds between metrics log lines. 0 turns them off.
metrics_interval_secs = 60

# Address the client API listens on (publish data, submit tasks).
# Remove to run without one.
client_listen = "0.0.0.0:7100"

# Serve /metrics (Prometheus) and /healthz here. Unset serves neither.
# No authentication, so bind it to localhost or a management interface.
metrics_listen = "127.0.0.1:9100"

# Seconds between link measurements. 0 leaves the scheduler on whatever
# latency and bandwidth were configured by hand.
probe_interval_secs = 60

# Cache results of identical work: same kind, same payload, same inputs,
# same module. 0 entries turns it off. Failures are never cached.
result_cache_entries = 1024
result_cache_ttl_secs = 300

# How long a queued task waits before it counts as one level more urgent.
# 0 turns promotion off, which makes a low priority a genuine risk of never
# running at all. Set it only if you mean that.
queue_aging_secs = 30

# Most tasks allowed to wait at once. 0 means no cap, which is the default:
# a mesh that silently starts refusing work is worse than one that visibly
# falls behind, so this is your decision rather than ours.
max_queue_size = 0

# What gives way when the queue is full.
#   reject               - turn the newest away; the caller can retry or shed
#   drop_oldest          - newest wins; for a live feed where stale is worthless
#   drop_lowest_priority - keep the queue full of work that matters
queue_rejection = "reject"

# Seconds a task waits for a node before giving up. 0 means never. A caller
# can override this per submission with `timeout_ms`.
queue_timeout_secs = 0

# Where finished workflow steps are recorded, so a named run that is submitted
# again picks up where it stopped. Unset, the default, turns it off.
#
# It holds step numbers and the ids of what they produced, never the outputs:
# those stay on the nodes that computed them. Steps are skipped only when the
# workflow matches what the run was recorded against and the output is still
# in the mesh, so this cannot quietly answer with somebody else's results.
# checkpoint_path = "/var/lib/aethermesh/checkpoints.jsonl"

# Where to send traces, as an OTLP/HTTP endpoint. Unset sends none.
#
# Needs a build with `--features otel`. /metrics answers "how much"; this
# answers "what happened to this one task", which a counter cannot.
# RUST_LOG controls the console, AETHERMESH_TRACE controls what is exported.
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"

# Seconds between autoscaler readings. 0 turns it off, which is the default.
# It only ever recommends: acting on the recommendation is your decision, or
# aether-cloud's. A bad reading should cost a log line, not a bill.
autoscale_interval_secs = 0

# What each term of the placement score counts for.
#   score = cpu*cpu_usage + memory*memory_usage + transfer*seconds
#           + latency*seconds - locality*share_already_here
#
# `locality` is the trade-off. High keeps work with its data: fewer bytes move,
# and a workflow concentrates onto whichever node produced its first result.
# Low spreads work across machines and moves more bytes. Neither is right for
# everybody, which is why it is a setting.
[scheduler_weights]
cpu = 1.0
memory = 0.5
transfer = 1.0
latency = 1.0
locality = 1.0


[autoscale]
# What to scale towards. One of:
#   { kind = "queue_length",    per_node = 2.0 }   work waiting per node
#   { kind = "cpu_utilization", fraction = 0.7 }   when tasks are long and
#                                                  the queue rarely builds
#   { kind = "latency",         max_wait_secs = 5.0 }  when you promised a deadline
target = { kind = "queue_length", per_node = 2.0 }

min_nodes = 1
max_nodes = 16

# Long enough for a machine to boot, register, and start draining. Anything
# shorter decides again before the last decision has had an effect.
cooldown_secs = 120

# How far off target counts as off target. Without a dead band the mesh
# oscillates around the target forever, paying startup cost on every swing.
tolerance = 0.25
