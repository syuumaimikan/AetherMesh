# AetherMesh agent configuration.
# Every key is optional; anything omitted keeps its default.
# CLI flags override this file.

# Controller to register with.
controller = "mesh.example.com:7000"

# Address other nodes can reach this agent on.
advertise = "192.168.1.42:7001"

# Seconds between heartbeats.
heartbeat_secs = 5

# Shared secret, when the controller requires one.
# Prefer the AETHERMESH_TOKEN environment variable on shared machines.
auth_token = "change-me"

# Where this node's persistent id is stored. Keeping it means a restarted
# agent rejoins as the same node instead of appearing as a new one.
# Defaults to <data dir>/aethermesh/node-id.
# identity_path = "/var/lib/aethermesh/node-id"

# Certificate to verify the controller against (its own cert, if self-signed).
# Setting this switches the connection to TLS.
tls_ca_path = "cert.pem"

# Name the certificate was issued for. Defaults to the controller's host part.
# tls_server_name = "mesh.example.com"

# Link speed toward this node, in bytes per second. Feeds the scheduler's
# transfer cost and the compression policy. Leave unset if you do not know it.
bandwidth_bytes_per_sec = 12500000

# What this machine is. Tasks constrain against these, so a task requiring
# `gpu=true` never lands on a node that has not claimed it. Nothing verifies
# a label: claiming a GPU you do not have means being sent GPU work you fail.
labels = ["kind=cpu", "region=eu-west"]

# Most bytes of received data this node will hold at once. Over it, the least
# recently used datasets are dropped and the controller is told, so it stops
# sending work whose inputs are no longer here. Unset means no limit — fine on
# a workstation, not on a board with 1 GB of RAM.
storage_budget_bytes = 268435456

# Extra connections to offer for bulk data. Chunks are spread across them,
# which helps when one TCP stream cannot fill the link.
data_channels = 2

# How many tasks this node runs at once. Unset means one per logical CPU.
# Lower it on a machine that is doing something else with its cores: a node
# that agreed to more work than it can do is worse than one that said no.
# max_concurrent_tasks = 4

# Longest gap between attempts to reach the controller again after the
# connection drops. The gap doubles from a second up to this. `0` makes the
# agent exit instead, which is what it used to do.
#
# Staying alive is what lets a controller restart cheaply: this node still
# holds everything it was sent, and tells the new controller about it rather
# than being shipped all of it again.
reconnect_max_secs = 30
