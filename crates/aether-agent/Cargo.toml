[package]
name = "aether-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "AetherMesh worker node: registers with a controller, reports metrics, and runs tasks"

[features]
default = ["wasm"]
# TLS for the control connection.
tls = ["dep:tokio-rustls"]
# WebAssembly tasks, so work written in other languages can run here.
wasm = ["dep:aether-wasm", "aether-wasm/wasmi-backend"]
# Same, on the Cranelift JIT instead of the interpreter.
wasm-jit = ["dep:aether-wasm", "aether-wasm/wasmtime-backend"]

[dependencies]
aether-core.workspace = true
aether-protocol.workspace = true
aether-wasm = { workspace = true, optional = true }
anyhow.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aether-controller.workspace = true
aether-protocol.workspace = true
aether-scheduler.workspace = true
base64.workspace = true
serde_json.workspace = true
wat = "1"

[lints]
workspace = true

