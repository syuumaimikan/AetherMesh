[package]
name = "aether-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Sandboxed WebAssembly task execution for AetherMesh, on wasmi or wasmtime, with fuel and memory limits"

[features]
# Pure-Rust interpreter: builds anywhere, including Raspberry Pi, with no C
# toolchain. This is the default for a reason.
default = ["wasmi-backend"]
wasmi-backend = ["dep:wasmi"]
# Cranelift JIT: faster on CPU-bound modules, heavier to build.
wasmtime-backend = ["dep:wasmtime"]

[dependencies]
getrandom.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmi = { version = "0.46", optional = true }
wasmtime = { version = "36.0.13", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }

[dev-dependencies]
wat = "1"

[lints]
workspace = true

