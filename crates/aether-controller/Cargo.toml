[package]
name = "aether-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "AetherMesh control plane: node registry, dispatch, data catalog, and the JSON client API"

[features]
default = []
# TLS for agent connections, plus self-signed certificate generation.
tls = ["dep:tokio-rustls", "dep:rcgen"]
# Exports traces to an OpenTelemetry collector over OTLP/HTTP.
#
# Off by default, like the cloud adapters: a mesh of small boards should not
# compile an exporter it will never point at anything.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
aether-core.workspace = true
aether-protocol.workspace = true
aether-scheduler.workspace = true
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
rcgen = { version = "0.14", default-features = false, features = [
    "ring",
    "pem",
    # Needed to sign a client certificate with an existing CA.
    "x509-parser",
], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    # JSON rather than protobuf: the payload is then something an operator can
    # read, and checking that spans arrive needs no protobuf decoder.
    "http-json",
    # Blocking, not async: the batch processor owns a thread of its own, and an
    # async client there has no reactor to send on — the export silently never
    # happens. Found by watching a collector receive nothing at all.
    "reqwest-blocking-client",
    # So an exporter that cannot reach its collector says so instead of
    # dropping spans quietly.
    "internal-logs",
    "trace",
], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
blake3.workspace = true
aether-agent.workspace = true

[lints]
workspace = true
