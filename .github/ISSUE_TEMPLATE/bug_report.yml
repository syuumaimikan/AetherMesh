name: Bug report
description: Something behaves differently from what the docs say it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, please do not file an issue — see
        [SECURITY.md](https://github.com/syuumaimikan/AetherMesh/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The agent registered, then the controller evicted it after ~15 s even
        though heartbeats were still arriving. I expected it to stay in the
        node list.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The commands you ran, in order. A configuration file or a short
        program is more useful than a description of one.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Controller and agent output. `RUST_LOG=debug` shows the dispatch
        decisions. Redact tokens and hostnames you would rather not publish.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag, or `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Other (say which in "What happened")
    validations:
      required: true

  - type: input
    id: features
    attributes:
      label: Cargo features
      description: How you built it, e.g. `--features tls,wasm-jit`.
      placeholder: default
