# Every push and pull request, on the three platforms people actually run this
# on, plus the cross-compile that matters most (Raspberry Pi).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI caches and artifacts small; nothing here is debugged interactively.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Default features
        run: cargo test --workspace

      - name: TLS and cloud adapters
        run: cargo test --workspace --features aether-controller/tls,aether-agent/tls,aether-cloud/cloud-http

      - name: WebAssembly JIT backend
        run: cargo test -p aether-wasm --no-default-features --features wasmtime-backend

      # The dashboard has an example that renders a frame against a live
      # controller; it is how the screenshots in the docs are produced.
      - name: Dashboard examples build
        run: cargo build -p aether-tui --examples

  # The gated metrics are byte counts, which are arithmetic rather than
  # measurement: identical across restarts, seeds, and node counts. Wall clock
  # on a shared runner is not, so it is reported and never gates.
  regression:
    name: benchmark regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the mesh
        run: cargo build --release -p aether-controller -p aether-agent -p aether-benchmark

      - name: Start a controller and two agents
        run: |
          set -euo pipefail
          ./target/release/aether-controller --listen 127.0.0.1:7000             --client-listen 127.0.0.1:7100 &

          # Wait on the port rather than on a sleep. A fixed sleep is either
          # too short on a loaded runner or wasted time on an idle one.
          for _ in $(seq 1 100); do
            (exec 3<>/dev/tcp/127.0.0.1/7100) 2>/dev/null && break
            sleep 0.1
          done

          ./target/release/aether-agent --controller 127.0.0.1:7000             --advertise 127.0.0.1:7001 --identity-path ./ci-a.id &
          ./target/release/aether-agent --controller 127.0.0.1:7000             --advertise 127.0.0.1:7002 --identity-path ./ci-b.id &

          # And on both agents actually registering, for the same reason.
          for _ in $(seq 1 100); do
            nodes=$(./target/release/aether-benchmark network --tasks 1               --dataset-bytes 1024 --format json 2>/dev/null               | grep -c '"hostname"' || true)
            [ "$nodes" -ge 2 ] && break
            sleep 0.2
          done

      - name: Compare against the committed baseline
        run: ./target/release/aether-benchmark regress --baseline bench/baseline.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # An agent is often a Raspberry Pi, so the build that matters is the one
  # nobody runs locally.
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release -p aether-agent --target ${{ matrix.target }}

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: TypeScript SDK type-checks
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck

      - name: Go SDK vets and builds
        working-directory: sdk/go
        run: |
          go vet ./...
          go build ./...

      - name: Python SDK imports
        run: python -c "import sys; sys.path.insert(0, 'sdk/python'); import aethermesh; print(aethermesh.AetherMesh, aethermesh.MeshExecutor)"

      # -Werror, because the SDK is two files and there is no excuse for a
      # warning to survive in them.
      - name: Java SDK compiles
        run: javac -Xlint:all -Werror -d /tmp/aethermesh-java sdk/java/src/main/java/dev/aethermesh/*.java sdk/java/examples/HashExample.java

      - name: .NET SDK builds
        run: dotnet build sdk/dotnet/AetherMesh --nologo -warnaserror
