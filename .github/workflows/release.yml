# Builds the three binaries for the platforms people actually run them on and
# attaches them to the tag's release. Nobody should have to install a Rust
# toolchain to try a dashboard.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable on demand, so a packaging change can be checked before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # A Raspberry Pi is a first-class node, so it gets a first-class build.
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          builder=$([ "${{ matrix.cross }}" = "true" ] && echo cross || echo cargo)
          "$builder" build --release --target ${{ matrix.target }} \
            -p aether-controller -p aether-agent -p aether-tui

      # The archive carries the licences and the readme: a binary someone
      # downloaded should say what it is and under what terms.
      - name: Package
        shell: bash
        run: |
          name="aethermesh-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for binary in aether-controller aether-agent aether-tui; do
            path="target/${{ matrix.target }}/release/$binary"
            [ -f "$path.exe" ] && path="$path.exe"
            cp "$path" "dist/$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
