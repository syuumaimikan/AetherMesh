<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AetherMesh">
  <title>AetherMesh</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#0F9D58"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- The mesh: five nodes, and the one edge that carries the data. -->
  <g stroke="url(#edge)" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M256 152 L136 300"/>
    <path d="M256 152 L376 300"/>
    <path d="M136 300 L256 396"/>
    <path d="M376 300 L256 396"/>
    <path d="M136 300 L376 300" stroke-opacity=".45" stroke-dasharray="6 22"/>
  </g>

  <!-- The payload, moving toward the node that already holds the data. -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="152" r="34"/>
    <circle cx="136" cy="300" r="26"/>
    <circle cx="376" cy="300" r="26"/>
    <circle cx="256" cy="396" r="26"/>
  </g>
  <circle cx="316" cy="226" r="13" fill="#FBBC05"/>
</svg>
