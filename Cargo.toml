[workspace]
resolver = "3"
members = [
    "crates/aether-core",
    "crates/aether-protocol",
    "crates/aether-agent",
    "crates/aether-cloud",
    "crates/aether-controller",
    "crates/aether-scheduler",
    "crates/aether-wasm",
    "crates/aether-benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/syuumaimikan/AetherMesh"
homepage = "https://syuumaimikan.github.io/AetherMesh/"
authors = ["AetherMesh contributors"]
keywords = ["distributed", "scheduler", "wasm", "cluster", "mesh"]
categories = ["concurrency", "network-programming", "wasm"]

[workspace.lints.rust]
unsafe_code = "forbid"

# A node may be a Raspberry Pi with a slow card and a power budget, so the
# release build optimises for a small, quick binary rather than for build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Debug builds are what the test suite and `cargo run` use, and they dominate
# `target/`. Dropping full debuginfo cuts that directory by more than half
# while still leaving line numbers in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Dependencies are rebuilt rarely and stepped through even more rarely.
[profile.dev.package."*"]
debug = false
opt-level = 1

# Benchmarks measure the code as it ships.
[profile.bench]
inherits = "release"
debug = false

[workspace.dependencies]
aether-core = { path = "crates/aether-core" }
aether-protocol = { path = "crates/aether-protocol" }
aether-agent = { path = "crates/aether-agent" }
aether-controller = { path = "crates/aether-controller" }
aether-scheduler = { path = "crates/aether-scheduler" }
aether-wasm = { path = "crates/aether-wasm", default-features = false }

anyhow = "1"
base64 = "0.22"
bincode = "2"
blake3 = "1"
clap = "4"
# OS entropy, nothing else: the `random` capability has to be a real CSPRNG,
# and this is the smallest way to get one.
getrandom = "0.3"
serde = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
uuid = "1"

