[workspace]
resolver = "3"
members = [
    "crates/aether-core",
    "crates/aether-protocol",
    "crates/aether-agent",
    "crates/aether-cloud",
    "crates/aether-controller",
    "crates/aether-scheduler",
    "crates/aether-wasm",
    "crates/aether-benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aether-core = { path = "crates/aether-core" }
aether-protocol = { path = "crates/aether-protocol" }
aether-agent = { path = "crates/aether-agent" }
aether-controller = { path = "crates/aether-controller" }
aether-scheduler = { path = "crates/aether-scheduler" }
aether-wasm = { path = "crates/aether-wasm", default-features = false }

anyhow = "1"
base64 = "0.22"
bincode = "2"
blake3 = "1"
clap = "4"
serde = "1"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
toml = "1.1"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
uuid = "1"

